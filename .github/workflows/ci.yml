name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

# The suite must never need cloud credentials. If it ever does, these jobs fail.
env:
  CAIRN_MODE: fixture

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: Assert no AWS credentials are present
        run: ./.github/scripts/assert-no-aws-credentials.sh

      - name: Tests
        run: uv run --no-project python -m pytest -q

      - name: Safety suite must be green on its own
        run: uv run --no-project python -m pytest tests/safety -q

      - name: Evaluation gate (docs/architecture/06 6.4 and 6.8)
        run: uv run --no-project python -m app.evaluation --json evaluation-report.json

      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation-report.json

      - name: Deterministic replay must be stable across processes
        run: |
          set -euo pipefail
          signature() {
            uv run --no-project python -c "
          import asyncio
          from app.domain.run_service import Run
          async def main():
              r = Run(); r.inject_all_events(); await r.analyse()
              print(r.replay_signature())
          asyncio.run(main())" 2>/dev/null | tail -1
          }
          A=$(signature)
          B=$(signature)
          echo "run A: $A"
          echo "run B: $B"
          if [ -z "$A" ] || [ "$A" != "$B" ]; then
            echo "::error::replay signature is not stable across separate processes"
            exit 1
          fi

  demo:
    name: clean checkout starts the demo
    runs-on: ubuntu-latest
    # A green demo means nothing if the suite is red.
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No cache here: this job exists to prove a cold checkout works.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - run: uv python install 3.12
      - run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Assert no AWS credentials are present
        run: ./.github/scripts/assert-no-aws-credentials.sh

      - name: Boot the situation room and walk the golden path over HTTP
        run: |
          set -euo pipefail
          uv run --no-project python -m uvicorn app.api.main:app --port 8000 &
          SERVER_PID=$!
          # Always reap the server; leaving it running hung the post-job cleanup.
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 1; done

          curl -sf http://127.0.0.1:8000/healthz | tee /dev/stderr | grep -q '"credentialsRequired":false'
          curl -sf http://127.0.0.1:8000/ -o /dev/null
          curl -sf -X POST http://127.0.0.1:8000/v1/events -o /dev/null
          curl -sf -X POST http://127.0.0.1:8000/v1/runs/current/analyse -o /dev/null

          echo "--- a prohibited action must be refused with 403 POLICY_DENIED ---"
          CODE=$(curl -s -o /tmp/denied.json -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/v1/actions/prohibited \
            -H 'content-type: application/json' \
            -d '{"actionType":"OVERRIDE_SAFETY_INTERLOCK"}')
          cat /tmp/denied.json
          test "$CODE" = "403"
          grep -q 'POLICY_DENIED' /tmp/denied.json

          echo "--- an action before approval must also be refused ---"
          curl -sf -X POST http://127.0.0.1:8000/v1/scenarios/scn_recover_tonnes/select -o /dev/null
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/v1/actions)
          test "$CODE" = "403"
