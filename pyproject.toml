[project]
name = "cairn"
version = "0.1.0"
description = "CAIRN - governed mine operations decision fabric (hackathon vertical slice)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]
# Optional. The evaluation gate never requires it; see app/evaluation/opik_tracing.py.
eval = ["opik>=1.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
